<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Davi Almeida Souto — Desenvolvedor Full Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#0F1B2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
      .in{opacity:0;animation:in .8s ease-out forwards}
      .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:0;transform:scale(2.4)}}
      .node{animation:node 4s ease-in-out infinite}
      @keyframes node{0%,100%{opacity:.5}50%{opacity:1}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <g stroke="#06B6D4" stroke-opacity="0.35" stroke-width="1.5" fill="none">
      <path d="M880 92 L980 150 L1080 104"/>
      <path d="M980 150 L960 240 L1070 226"/>
      <path d="M980 150 L1080 104 L1070 226"/>
      <path d="M880 92 L960 240"/>
    </g>
    <g fill="#0B1120" stroke="#06B6D4" stroke-width="2">
      <circle class="node" cx="880" cy="92" r="7"/>
      <circle class="node" cx="980" cy="150" r="10" style="animation-delay:.6s"/>
      <circle class="node" cx="1080" cy="104" r="6" style="animation-delay:1.2s"/>
      <circle class="node" cx="960" cy="240" r="6" style="animation-delay:1.8s"/>
      <circle class="node" cx="1070" cy="226" r="8" style="animation-delay:2.4s"/>
    </g>
    <circle cx="980" cy="150" r="3.5" fill="#06B6D4"/>

    <text x="64" y="58" class="mono" font-size="15" fill="#64748B">davisouto.dev</text>
    <circle cx="1056" cy="53" r="5" fill="#22C55E"/>
    <circle class="pulse" cx="1056" cy="53" r="5" fill="#22C55E"/>
    <text x="1136" y="58" class="mono" font-size="15" fill="#94A3B8" text-anchor="end">online</text>

    <g class="in">
      <text x="64" y="114" class="mono" font-size="20" fill="#06B6D4">&gt; whoami<tspan class="cursor" fill="#E2E8F0"> ▍</tspan></text>
    </g>
    <g class="in d1">
      <text x="62" y="176" class="sans" font-size="60" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Davi Almeida Souto</text>
    </g>
    <g class="in d2">
      <text x="64" y="218" class="sans" font-size="22" fill="#CBD5E1">Desenvolvedor Full Stack<tspan fill="#475569">  /  </tspan><tspan fill="#94A3B8">React · Node.js · Python</tspan></text>
    </g>
    <g class="in d3 mono" font-size="14">
      <text x="64" y="268" fill="#64748B">curto explorar</text>
      <g transform="translate(196 249)">
        <rect width="72" height="28" rx="14" fill="#0E2233" stroke="#06B6D4" stroke-opacity="0.45"/>
        <text x="36" y="19" fill="#67E8F9" text-anchor="middle">Dados</text>
        <rect x="82" width="80" height="28" rx="14" fill="#0E2233" stroke="#06B6D4" stroke-opacity="0.45"/>
        <text x="122" y="19" fill="#67E8F9" text-anchor="middle">Python</text>
        <rect x="172" width="58" height="28" rx="14" fill="#0E2233" stroke="#06B6D4" stroke-opacity="0.45"/>
        <text x="201" y="19" fill="#67E8F9" text-anchor="middle">RAG</text>
        <rect x="240" width="66" height="28" rx="14" fill="#0E2233" stroke="#06B6D4" stroke-opacity="0.45"/>
        <text x="273" y="19" fill="#67E8F9" text-anchor="middle">LLMs</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#1E293B"/>
</svg>
